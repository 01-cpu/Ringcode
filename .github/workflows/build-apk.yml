name: Build RingCode APK 

on:
push:
branches:
- main
- master
workflow_dispatch: 

jobs:
build:
name: Build Android Debug APK
runs-on: ubuntu-latest 

steps:

* name: Checkout Repository
uses: actions/checkout@v4
* name: Extract Project ZIP
run: |
find . -name "*.zip" -exec unzip -o {} ;

### New Step: Automatically generates the missing gradlew files in the cloud!

* name: Generate Missing Gradle Wrapper
run: gradle wrapper --gradle-version 8.9
* name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'
cache: gradle
* name: Change wrapper permissions
run: chmod +x gradlew
* name: Build with Gradle
run: ./gradlew assembleDebug
* name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: RingCode-debug-apk
path: app/build/outputs/apk/debug/app-debug.apk
if-no-files-found: error
